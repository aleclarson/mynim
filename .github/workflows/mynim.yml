name: MyNim npm package

on:
  push:
    paths-ignore:
      - 'packages/nim-toolchain/**'
      - '.agents/**'
  pull_request:
    paths-ignore:
      - 'packages/nim-toolchain/**'
      - '.agents/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install Linux desktop runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-0t64 libwebkit2gtk-4.1-0 libpango-1.0-0 libpangocairo-1.0-0 libfreetype6 libfontconfig1 fonts-dejavu-core
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm pack --dry-run
